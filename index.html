<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaModule &#x2192; VCV Rack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="version-badge">v1.1.10</div>
  <div class="page">
    <header>
      <h1 class="title">MetaModule <span class="arrow">&gt;</span> VCV Rack Converter</h1>
      <p class="subtitle">Convert a MetaModule .yml patch to a VCV Rack 2 .vcv file</p>
    </header>

    <div class="card">
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".yml,.yaml">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.25"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <div class="drop-label">Drop a .yml patch file here</div>
        <div class="drop-hint">or click to browse</div>
        <div class="file-badge" id="fileBadge"></div>
      </div>

      <div class="options">
        <label for="rowCount">Rows</label>
        <select id="rowCount">
          <option value="auto" selected>Auto</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>


      <div class="download-area" id="downloadArea">
        <div class="download-info">
          <svg class="check-icon" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span class="download-name" id="downloadName"></span>
        </div>
        <a class="download-btn" id="downloadLink" download>Download .vcv</a>
      </div>

      <div class="error-area" id="errorArea"></div>
    </div>

    <footer>
      runs entirely in your browser
      &nbsp;&mdash;&nbsp;<a href="https://forum.4ms.info/t/i-made-a-yml-to-vcv-file-converter/2224">report bugs here</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="converter.js"></script>
</body>
</html>
